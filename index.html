            background-size: 101%;      
            background-position: center;  
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            border-radius: 15px
            transform: scale(1.01);
        }

        .banner-name {
            color: #555; 
            font-size: 1.3rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            white-space: nowrap;
        }

        .banner-name .first-name { font-weight: 800; }
        .banner-name .last-name { font-weight: 300; margin-left: 10px; }

        .profile-img-wrap {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 128px; 
    z-index: 5;
    pointer-events: none;
    -webkit-user-drag: none;
    user-select: none;
    -webkit-touch-callout: none;
}

       .profile-img-wrap img {
    width: 105px;
    height: 105px;
    border-radius: 12px;
    border: 3px solid white;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    object-fit: cover;
    background-color: #fff;
    display: block; 
}

        .main-content {
            margin-top: 50px;
            margin-bottom: 10px;           
            padding: 10px 25px 25px;
            text-align: center;
        }
           
        .handle, .bio-text {
    color: #222; 
    text-shadow: none; 
    -webkit-text-fill-color: initial; 
    background: none;  
}
        .handle {
    letter-spacing: 0.3rem;
    font-weight: 300;
    text-transform: lowercase;
    font-size: 0.75rem;
    margin-bottom: 8px; 
    margin-top: 5px;
}

.bio-text {
    color: #666;
    font-size: 0.65rem;
    line-height: 1.5; 
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-weight: 300;
    margin: 0 auto;
    max-width: 270px;
    margin-top: 8px; 
}
        .links-container {
            padding: 0px 30px 40px;
        }

        .links-container a {
    opacity: 0;
    text-decoration: none;
    animation: dominoFade 0.8s ease-out forwards;
}

@keyframes dominoFade {
    from { 
        opacity: 0;
        transform: translateY(10px); 
    }
    to { 
        opacity: 1;
        transform: translateY(0);
    }
}
.links-container a:nth-child(1) { animation-delay: 0.3s; }
.links-container a:nth-child(2) { animation-delay: 0.5s; }
.links-container a:nth-child(3) { animation-delay: 0.7s; }
.links-container a:nth-child(4) { animation-delay: 0.9s; }
        
    opacity: 1;
    transition: opacity 0.4s ease-in-out, filter 0.5s ease-in-out;
}

.fade-out {
    opacity: 0 !important;
}

        .link-row {
            display: grid;
            grid-template-columns: 45px 1fr;
            align-items: center;
            text-decoration: none;
            background: #ffffff;
            margin-bottom: 10px;
            border-radius: 8px; 
            padding: 12px 15px;
            border: 1px solid #f0f0f0;
            transition: all 0.2s ease-in-out;
            color: #111; 
        }

        .link-row:hover {
            border-color: #ddd;
            background-color: #fafafa;
        }

        .link-row:active {
            background-color: #f2f2f2; 
            border-color: #ccc;
            color: #777; 
            transform: scale(0.97); 
        }

        .icon-wrap {
            font-size: 1.1rem;
            display: flex;
            justify-content: flex-start;
        }

        .link-text {
            font-weight: 500;
            font-size: 0.85rem;
            letter-spacing: 0.2px;
        }

        @media (min-width: 600px) {
            .card-container { max-width: 420px; }
        }
    * {
     -webkit-user-select: none;
    user-select: none;
}
@media print {
    body { display: none !important; }
}
        @keyframes softArchiveFade {
    from {
        opacity: 0;
        transform: scale(1); 
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
body {
    opacity: 1;
    filter: none;
    transition: opacity 0.4s ease-in-out, filter 0.5s ease-in-out;
}

.fade-out {
    opacity: 0 !important;
}

.is-blurred {
    filter: blur(60px) !important;
}
    </style>
</head>

    <div class="card-container">
